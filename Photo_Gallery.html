<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .photo {
            width: 280px;
            height: 210px;
            overflow: hidden;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo img:hover {
            transform: scale(1.08);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .photo {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <h1>MY PHOTO GALLERY</h1>

    <div class="gallery">

        <div class="photo">
            <img src="Nature.png" alt="Nature">
        </div>

        <div class="photo">
            <img src="Mountain.png" alt="Mountain">
        </div>

        <div class="photo">
            <img src="Dog.png" alt="Dog">
        </div>

        <div class="photo">
            <img src="River.png" alt="River">
        </div>

        <div class="photo">
            <img src="Forest.png" alt="Forest">
        </div>

        <div class="photo">
            <img src="Beach.png" alt="Beach">
        </div>
</div>

</body>
</html>
